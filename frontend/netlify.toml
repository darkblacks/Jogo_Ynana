# Netlify: use "frontend" como Base directory. Não precisa de dependências.
[build]
  publish = "."
  command = "node gerar-config.mjs"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

# Atalhos para a página de download do app
[[redirects]]
  from = "/app"
  to = "/baixar/"
  status = 301

[[redirects]]
  from = "/download"
  to = "/baixar/"
  status = 301

[[redirects]]
  from = "/android"
  to = "/baixar/"
  status = 301
