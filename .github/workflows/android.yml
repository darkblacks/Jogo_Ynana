# Gera o app Android (APK) do Gachaqui a cada atualização do jogo e publica em "Releases".
# Link fixo para baixar a versão mais nova:
#   https://github.com/<dono>/<repo>/releases/latest/download/gachaqui.apk
name: App Android (APK)

on:
  push:
    branches: [main, master, claude/serene-goodall-ko7s49]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write # para publicar o APK em Releases

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # As máquinas do GitHub já têm o SDK do Android (ANDROID_HOME); o Gradle baixa o que faltar.
      - name: Conferir o SDK do Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências do app
        working-directory: mobile
        run: npm ci

      - name: Copiar o site para dentro do app
        working-directory: mobile
        run: npm run sync

      - name: Compilar o APK
        working-directory: mobile/android
        env:
          GACHAQUI_VERSION_CODE: ${{ github.run_number }}
          GACHAQUI_VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.GACHAQUI_KEYSTORE_BASE64 }}
          GACHAQUI_KEYSTORE_PASSWORD: ${{ secrets.GACHAQUI_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$GACHAQUI_KEYSTORE_PASSWORD" ]; then
            # chave própria (segredos do repositório): mesma assinatura em todos os builds
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gachaqui.keystore"
            export GACHAQUI_KEYSTORE="$RUNNER_TEMP/gachaqui.keystore"
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../../gachaqui.apk
            echo "ASSINATURA=propria" >> "$GITHUB_ENV"
          else
            # sem os segredos: APK de teste (instala normalmente, mas para atualizar é preciso desinstalar antes)
            echo "::warning::Segredos GACHAQUI_KEYSTORE_BASE64/GACHAQUI_KEYSTORE_PASSWORD não configurados: gerando APK de teste (debug)."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../../gachaqui.apk
            echo "ASSINATURA=teste" >> "$GITHUB_ENV"
          fi
          rm -f "$RUNNER_TEMP/gachaqui.keystore"
          ls -la ../../gachaqui.apk

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: gachaqui-apk
          path: gachaqui.apk

      - name: Publicar em Releases (link fixo para os amigos)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Gachaqui para Android 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: gachaqui.apk
          body: |
            App do Gachaqui para Android, gerado automaticamente.
            Baixe o **gachaqui.apk** no celular e abra para instalar (permita "instalar apps desconhecidos" se o Android pedir).
            Joga com quem está no site: o modo online usa o mesmo servidor.
            Assinatura: ${{ env.ASSINATURA }} (se for "teste", desinstale a versão anterior antes de instalar esta).
